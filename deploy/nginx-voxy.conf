# Per-IP limit for speech generation (included inside nginx's http block).
# Row "Preview" buttons also hit /api/tts, so keep the burst generous; tune here.
limit_req_zone $binary_remote_addr zone=tts:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    # MAX_CHARS (5,000) of 4-byte UTF-8 is ~20 KB of JSON; 64k leaves room.
    client_max_body_size 64k;
    location = /api/tts {
        limit_req zone=tts burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
