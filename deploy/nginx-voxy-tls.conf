# Production config for text-2-speech.com (after certbot has issued the
# certificate; nginx-voxy.conf is the plain-HTTP bootstrap used by setup.sh).
# Install: cp to /etc/nginx/sites-available/voxly && nginx -t && systemctl reload nginx

# Per-IP limits. Row "Preview" buttons also hit /api/tts, so its burst is generous; tune here.
limit_req_zone $binary_remote_addr zone=tts:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=support:1m rate=3r/m;

server {
    listen 443 ssl;
    http2 on;
    server_name text-2-speech.com;
    server_tokens off;
    # MAX_CHARS (5,000) of 4-byte UTF-8 is ~20 KB of JSON; 64k leaves room.
    client_max_body_size 64k;
    # text/html is always compressed; add the rest (i18n-sub.js alone is 211 KB).
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    location = /api/tts {
        limit_req zone=tts burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location = /api/support {
        limit_req zone=support burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /admin/login {
        limit_req zone=support burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    ssl_certificate /etc/letsencrypt/live/text-2-speech.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/text-2-speech.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# www and plain HTTP: one permanent redirect to the canonical host
server {
    listen 443 ssl;
    http2 on;
    server_name www.text-2-speech.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/text-2-speech.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/text-2-speech.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    return 301 https://text-2-speech.com$request_uri;
}
server {
    listen 80;
    server_name text-2-speech.com www.text-2-speech.com;
    server_tokens off;
    return 301 https://text-2-speech.com$request_uri;
}
